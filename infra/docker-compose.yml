services:
  postgres:
    image: postgres:16
    container_name: synapse-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "5434:5432"
    volumes:
      - synapse_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: synapse-redis
    ports:
      - "6381:6379"

  neo4j:
    image: neo4j:5
    container_name: synapse-neo4j
    environment:
      NEO4J_AUTH: neo4j/synapse123
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - synapse_neo4j_data:/data

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.25.5
    container_name: synapse-weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
    ports:
      - "8081:8080"
      - "50052:50051"
    volumes:
      - synapse_weaviate_data:/var/lib/weaviate

volumes:
  synapse_pg_data:
  synapse_neo4j_data:
  synapse_weaviate_data: